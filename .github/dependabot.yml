# Keeps the SHA-pinned actions current (#270).
#
# Pinning to a full commit SHA freezes reviewed code, and its cost is that a
# pin never moves on its own. Without this the pins rot — and a rotted pin is
# worse than a tag when what moved upstream was a security fix.
#
# Dependabot updates the SHA *and* the trailing version comment, so a bump
# arrives as a reviewable PR. It preserves the pinning style it finds, so its
# PRs stay compatible with the organization policy requiring full-length SHAs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Bump"
    labels: []
    ignore:
      # Azure maintains the v1 TAG by moving it forward, but their last GitHub
      # Release was published in 2021. Dependabot resolves releases, not tags,
      # so every proposal for this action is a three-and-a-half-year downgrade
      # (Consultologist/Consultologist#17).
      #
      # The cost is real: no Dependabot updates for this action at all, so a
      # genuine new release needs noticing by hand. Acceptable only while the
      # release feed stays dead and the tag is what moves.
      - dependency-name: "Azure/static-web-apps-deploy"
