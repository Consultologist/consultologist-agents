# Keeps the SHA-pinned actions current (#270).
#
# Pinning to a full commit SHA freezes reviewed code, and its cost is that a
# pin never moves on its own. Without this the pins rot — and a rotted pin is
# worse than a tag when what moved upstream was a security fix.
#
# Dependabot updates the SHA *and* the trailing version comment, so a bump
# arrives as a reviewable PR. It preserves the pinning style it finds, so its
# PRs stay compatible with the organization policy requiring full-length SHAs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Bump"
    labels: []
