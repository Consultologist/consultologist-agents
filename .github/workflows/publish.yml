name: Publish agents

on:
  push:
    branches: [main]
  # Republish after a failed run, without a content change: the paths given
  # here stand in for the merge commit's diff (a failed Foundry create leaves
  # nothing published, so re-running the same content is safe — the registry
  # refuses an overwrite regardless).
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated paths to treat as changed, e.g. agents/classification.yaml agents/output-contracts.json"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AI_ENDPOINT: https://consultologist-canada-east-resou.services.ai.azure.com/api/projects/consultologist-canada-east
  AI_API_VERSION: v1
  REGISTRY_ACCOUNT: consultologistpublic

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect changed content
        id: diff
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.paths }}" ]; then
            CHANGED=$(echo "${{ github.event.inputs.paths }}" | tr ' ' '\n')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git show --name-only --format= HEAD)
          fi
          echo "changed<<EOF2" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF2" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"
      - name: Azure login (OIDC)
        if: contains(steps.diff.outputs.changed, 'agents/')
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish changed agent versions to Foundry + mirror
        if: contains(steps.diff.outputs.changed, '.yaml')
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          for YAML in $(echo "${{ steps.diff.outputs.changed }}" | grep -E '^agents/[^/]+\.yaml$' || true); do
            NAME=$(basename "$YAML" .yaml)
            VERSION=$(python3 -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['version'])" "$YAML")
            echo "Publishing $NAME v$VERSION to Foundry…"
            # The yaml embeds a json_schema as a block scalar (a string, so it
            # can be pinned byte-for-byte against agents/schemas/*.json); Foundry
            # wants the schema as an object. Parse it on the way out.
            python3 -c "
          import yaml, json, sys
          m = yaml.safe_load(open('$YAML'))
          fmt = ((m['definition'].get('text') or {}).get('format') or {})
          if isinstance(fmt.get('schema'), str):
              fmt['schema'] = json.loads(fmt['schema'])
          print(json.dumps({'definition': m['definition']}))" > /tmp/body.json
            CREATED=$(az rest --method POST \
              --url "$AI_ENDPOINT/agents/$NAME/versions?api-version=$AI_API_VERSION" \
              --resource "https://ai.azure.com" \
              --body @/tmp/body.json --query "version" -o tsv)
            if [ "$CREATED" != "$VERSION" ]; then
              echo "::error::Foundry assigned version $CREATED but $YAML declares $VERSION — align the yaml before merging"
              exit 1
            fi
            ./scripts/publish-agent-definition.sh "$REGISTRY_ACCOUNT" "$NAME"
          done
      # #374: the last gate before an IMMUTABLE upload. validate.yml answers
      # this on the pull request; this repeats it here so a stranding refuses the
      # publish rather than being reported after the version exists forever.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(steps.diff.outputs.changed, 'agents/output-contracts.json')
        with:
          repository: Consultologist/Consultologist-Blazor
          submodules: true
          path: engine
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: contains(steps.diff.outputs.changed, 'agents/output-contracts.json')
        with:
          dotnet-version: "10.0.x"
      - name: This catalog would strand no published package
        if: contains(steps.diff.outputs.changed, 'agents/output-contracts.json')
        timeout-minutes: 10
        run: dotnet run -v q --file engine/scripts/check-catalog-strands-packages.cs -- agents
      - name: Publish catalog if changed
        if: contains(steps.diff.outputs.changed, 'agents/output-contracts.json')
        run: ./scripts/publish-output-contracts.sh "$REGISTRY_ACCOUNT"
